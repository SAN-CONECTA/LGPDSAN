name: Testes

# Roda em todo push/PR e também é chamado pelos workflows que gravam em produção
# (ver anpd-sync.yml), que só seguem se esta etapa passar.
on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # O Firestore Emulator roda em Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix functions
          npx playwright install --with-deps chromium
          pip install firebase-admin pytest

      - name: Sintaxe das Functions
        run: npm --prefix functions run lint

      - name: Testes da Central ANPD (sem rede, sem gravar)
        run: |
          python3 -m pytest scripts/test_anpd_sync.py -q
          node scripts/test_anpd_js.mjs

      # Projeto demo-lgpdsan: tudo roda nos emuladores, sem credenciais e sem tocar em produção.
      - name: Regras + Functions no Firebase Emulator Suite
        run: npm test

      - name: Testes E2E + acessibilidade
        run: npm run test:e2e
