name: Publicar regras do Firestore

on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar credencial exclusiva das regras
        env:
          FIREBASE_RULES_DEPLOYER: ${{ secrets.FIREBASE_RULES_DEPLOYER }}
        run: |
          if [ -z "$FIREBASE_RULES_DEPLOYER" ]; then
            echo "::error::Secret FIREBASE_RULES_DEPLOYER não configurado." >&2
            echo "::error::Crie uma conta de serviço exclusiva com o papel Firebase Rules Admin e cadastre o JSON completo nos Secrets do repositório." >&2
            exit 1
          fi

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_RULES_DEPLOYER }}

      - name: Publicar somente as regras do Firestore
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project lgpdsan --non-interactive
