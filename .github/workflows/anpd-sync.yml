name: Sincronizar publicações da ANPD

on:
  schedule:
    # A cada 6 horas (UTC). Ver CHANGELOG/docs para o fuso do Brasil.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install firebase-admin

      - name: Preparar credencial de serviço do Firebase
        env:
          # FIREBASE_ANPD_SYNC é o segredo recomendado para uma conta exclusiva
          # da sincronização. Enquanto ele não existir, usa a credencial já
          # configurada para o deploy das regras.
          FIREBASE_ANPD_SYNC: ${{ secrets.FIREBASE_ANPD_SYNC || secrets.FIREBASE_RULES_DEPLOYER }}
        run: |
          if [ -z "$FIREBASE_ANPD_SYNC" ]; then
            echo "::error::Configure o secret FIREBASE_ANPD_SYNC (recomendado) ou FIREBASE_RULES_DEPLOYER." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_ANPD_SYNC" > "$RUNNER_TEMP/service-account.json"
          python3 -m json.tool "$RUNNER_TEMP/service-account.json" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Sincronizar publicações no Firestore
        run: python3 scripts/anpd_sync.py

      - name: Testes da sincronização (dry-run, sem gravar)
        run: python3 scripts/anpd_sync.py --dry-run
