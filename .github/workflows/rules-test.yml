name: Testes das regras do Firestore

on:
  pull_request:
    paths:
      - firestore.rules
      - tests/rules/**
  push:
    branches: [main]
    paths:
      - firestore.rules
      - tests/rules/**

permissions:
  contents: read

concurrency:
  group: rules-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Instalar dependências dos testes
        run: npm ci
        working-directory: tests/rules

      - name: Rodar os testes das regras (emulador)
        run: npm test
        working-directory: tests/rules
